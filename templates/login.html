<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — Dashboard Gresik</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue-dark:   #0D2B5E;
      --blue-mid:    #1A4A9E;
      --blue-light:  #2D6FD4;
      --blue-pale:   #E8F0FE;
      --gold:        #C8A84B;
      --white:       #FFFFFF;
      --gray-text:   #4A5568;
      --gray-border: #CBD5E0;
      --red:         #E53E3E;
      --green:       #38A169;
    }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0D2B5E 0%, #1A4A9E 100%);
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, rgba(13,43,94,0.82) 0%, rgba(26,74,158,0.70) 100%);
      backdrop-filter: blur(2px);
      z-index: 0;
    }

    .particles { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .particle {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      animation: float linear infinite;
    }
    .particle:nth-child(1)  { width:60px;  height:60px;  left:10%; animation-duration:18s; animation-delay:0s;   }
    .particle:nth-child(2)  { width:30px;  height:30px;  left:25%; animation-duration:14s; animation-delay:3s;   }
    .particle:nth-child(3)  { width:80px;  height:80px;  left:60%; animation-duration:22s; animation-delay:1s;   }
    .particle:nth-child(4)  { width:20px;  height:20px;  left:80%; animation-duration:16s; animation-delay:5s;   }
    .particle:nth-child(5)  { width:45px;  height:45px;  left:45%; animation-duration:20s; animation-delay:2s;   }
    @keyframes float {
      from { transform: translateY(110vh) rotate(0deg); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      to   { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      margin: 2rem;
      background: rgba(255,255,255,0.96);
      border-radius: 20px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.35), 0 0 0 1px rgba(255,255,255,0.2);
      overflow: hidden;
      animation: slideUp 0.5s cubic-bezier(.22,.61,.36,1) both;
    }
    @keyframes slideUp {
      from { opacity:0; transform: translateY(30px); }
      to   { opacity:1; transform: translateY(0); }
    }

    .card-header {
      background: linear-gradient(135deg, var(--blue-dark) 0%, var(--blue-mid) 100%);
      padding: 2rem 2rem 1.75rem;
      text-align: center;
      position: relative;
    }
    .card-header::after {
      content: '';
      position: absolute;
      bottom: -1px; left: 0; right: 0;
      height: 24px;
      background: rgba(255,255,255,0.96);
      border-radius: 24px 24px 0 0;
    }

    /* Logo image — no background box, just the image */
    .logo-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 80px; height: 80px;
      margin-bottom: 0.85rem;
    }
    .logo-wrap img {
      width: 80px;
      height: 80px;
      object-fit: contain;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.3));
    }

    .card-header h1 {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--white);
      letter-spacing: -0.02em;
      line-height: 1.3;
    }
    .card-header p {
      font-size: 0.8rem;
      color: rgba(255,255,255,0.65);
      margin-top: 0.3rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .card-body { padding: 1.75rem 2rem 2rem; }

    .flash {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 1.25rem;
    }
    .flash.danger { background: #FFF5F5; color: var(--red); border: 1px solid #FED7D7; }
    .flash.success { background: #F0FFF4; color: var(--green); border: 1px solid #C6F6D5; }

    .form-group { margin-bottom: 1.1rem; }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--blue-dark);
      margin-bottom: 0.4rem;
      letter-spacing: 0.02em;
    }
    .input-wrap { position: relative; }
    .input-wrap svg {
      position: absolute;
      left: 0.9rem; top: 50%;
      transform: translateY(-50%);
      width: 18px; height: 18px;
      color: var(--gray-text);
      pointer-events: none;
    }
    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 0.7rem 0.9rem 0.7rem 2.6rem;
      border: 1.5px solid var(--gray-border);
      border-radius: 10px;
      font-size: 0.9rem;
      font-family: inherit;
      color: #1A202C;
      background: #FAFAFA;
      transition: border-color .2s, box-shadow .2s, background .2s;
      outline: none;
    }
    input:focus {
      border-color: var(--blue-light);
      background: var(--white);
      box-shadow: 0 0 0 3px rgba(45,111,212,0.12);
    }
    input[type="password"] { padding-right: 1rem; }

    .toggle-pw {
      position: absolute;
      right: 2rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      color: var(--gray-text);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }
    .toggle-pw:hover { color: var(--blue-mid); }
    .toggle-pw svg { width: 18px; height: 18px; pointer-events: none; }

    .forgot-row {
      display: flex;
      justify-content: flex-end;
      margin-top: -0.5rem;
      margin-bottom: 1.25rem;
    }
    .forgot-row a {
      font-size: 0.78rem;
      color: var(--blue-light);
      text-decoration: none;
      font-weight: 500;
    }
    .forgot-row a:hover { text-decoration: underline; }

    .btn-login {
      width: 100%;
      padding: 0.8rem;
      background: linear-gradient(135deg, var(--blue-mid) 0%, var(--blue-light) 100%);
      color: var(--white);
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      letter-spacing: 0.01em;
      transition: opacity .2s, transform .15s, box-shadow .2s;
      box-shadow: 0 4px 15px rgba(26,74,158,0.35);
    }
    .btn-login:hover  { opacity: 0.92; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(26,74,158,0.4); }
    .btn-login:active { transform: translateY(0); }

    .divider {
      display: flex; align-items: center;
      gap: 0.75rem;
      margin: 1.25rem 0;
      color: #A0AEC0;
      font-size: 0.75rem;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1;
      height: 1px; background: var(--gray-border);
    }

    .register-link {
      text-align: center;
      font-size: 0.85rem;
      color: var(--gray-text);
    }
    .register-link a {
      color: var(--blue-mid);
      font-weight: 600;
      text-decoration: none;
    }
    .register-link a:hover { text-decoration: underline; }

    .card-footer {
      border-top: 1px solid #EDF2F7;
      padding: 0.9rem 2rem;
      text-align: center;
      font-size: 0.72rem;
      color: #A0AEC0;
      background: #FAFBFF;
    }
    .card-footer span { color: var(--gold); font-weight: 600; }

    .gold-bar {
      height: 3px;
      background: linear-gradient(90deg, var(--gold), #E8C96A, var(--gold));
    }
  </style>
</head>

  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
</div>

        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input type="password" id="password" name="password" placeholder="Masukkan kata sandi" required />
          <button type="button" class="toggle-pw" onclick="togglePassword()" aria-label="Tampilkan password">
            <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="forgot-row">
        <a href="/forgot-password">Lupa kata sandi?</a>
      </div>

      <button type="submit" class="btn-login">Masuk ke Dashboard</button>
    </form>
  </div>

  <div class="card-footer">
    &copy; 2026 <span>Pemerintah Kabupaten Gresik</span> — Sistem Monitoring Sentimen
  </div>
</div>

<script>
  function togglePassword() {
    const input = document.getElementById('password');
    const icon  = document.getElementById('eye-icon');
    if (input.type === 'password') {
      input.type = 'text';
      icon.innerHTML = `
        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
        <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
        <line x1="1" y1="1" x2="23" y2="23"/>`;
    } else {
      input.type = 'password';
      icon.innerHTML = `
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
        <circle cx="12" cy="12" r="3"/>`;
    }
  }
</script>

</body>
