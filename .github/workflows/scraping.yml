name: Scraping Gresik Otomatis
on:
  schedule:
    - cron: "0 0 * * 1"        # Twitter & Instagram → tiap Senin 00:00 UTC (masing-masing mandiri)
    - cron: "0 1 * * *"        # Berita              → tiap hari  01:00 UTC (08:00 WIB)
    - cron: "0 2 1-7 * 1"      # Google Maps         → Senin pertama tiap bulan, 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # BERITA — setiap hari
  # ─────────────────────────────────────────────────────────────────────────────
  scrape-berita:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.schedule == '0 1 * * *')
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Library
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Jalankan Scraping Berita
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: 1
        run: python Berita.py

      - name: Push Hasil
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git pull --rebase origin main
          git add output/
          git diff --staged --quiet || git commit -m "data: update Berita Gresik $(date +'%Y-%m-%d')"
          git push

  # ─────────────────────────────────────────────────────────────────────────────
  # TWITTER — setiap Senin
  # ─────────────────────────────────────────────────────────────────────────────
  scrape:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.schedule == '0 0 * * 1')
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install library
        run: |
          pip install twscrape pandas
          pip install Sastrawi
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers

      - name: Jalankan scraping
        env:
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          CT0: ${{ secrets.CT0 }}
          AUTH_TOKEN_2: ${{ secrets.AUTH_TOKEN_2 }}
          CT0_2: ${{ secrets.CT0_2 }}
        run: python scrape.py

      - name: Push hasil ke repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git add output/
          git commit -m "data: update Twitter Gresik $(date +'%Y-%m-%d')" || echo "no changes"
          git push

  # ─────────────────────────────────────────────────────────────────────────────
  # INSTAGRAM — setiap Senin, jadwal mandiri
  # ─────────────────────────────────────────────────────────────────────────────
  scrape-instagram:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.schedule == '0 0 * * 1')
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg ca-certificates
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" > /etc/apt/sources.list.d/google.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          google-chrome --version

      - name: Install Library
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Jalankan Scraping Instagram
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: 1
          IG_SESSIONID:  ${{ secrets.IG_SESSIONID }}
          IG_CSRFTOKEN:  ${{ secrets.IG_CSRFTOKEN }}
          IG_DS_USER_ID: ${{ secrets.IG_DS_USER_ID }}
          IG_MID:        ${{ secrets.IG_MID }}
          IG_DID:        ${{ secrets.IG_DID }}
          IG_RUR:        ${{ secrets.IG_RUR }}
        run: python Instagram.py

      - name: Push Hasil
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git pull --rebase origin main
          git add output/
          git diff --staged --quiet || git commit -m "Update Instagram Gresik $(date +'%Y-%m-%d')"
          git push

  # ─────────────────────────────────────────────────────────────────────────────
  # GOOGLE MAPS — Senin pertama tiap bulan, 02:00 UTC
  # ─────────────────────────────────────────────────────────────────────────────
  scrape-googlemaps:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Jalan saat: workflow_dispatch, ATAU cron khusus Google Maps (0 2 1-7 * 1).
    # Cron "1-7 * 1" = tanggal 1–7, hari Senin → Senin pertama tiap bulan.
    # Job ini TIDAK bergantung (needs) scrape-instagram agar bisa berdiri sendiri
    # di minggu-minggu tanpa jadwal Senin pertama. Jika tetap ingin berurutan
    # saat workflow_dispatch, ubah kembali ke needs: scrape-instagram.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.schedule == '0 2 1-7 * 1')
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Library
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Jalankan Scraping Google Maps
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: 1
          APIFY_API_TOKEN_1: ${{ secrets.APIFY_API_TOKEN_1 }}
          APIFY_API_TOKEN_2: ${{ secrets.APIFY_API_TOKEN_2 }}
          APIFY_API_TOKEN_3: ${{ secrets.APIFY_API_TOKEN_3 }}
        run: python googlemaps_baru.py

      - name: Push Hasil
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git pull --rebase origin main
          git add output/
          git diff --staged --quiet || git commit -m "Update Google Maps Gresik $(date +'%Y-%m-%d')"
          git push